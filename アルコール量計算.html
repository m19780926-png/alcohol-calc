<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ハイボール濃度計算アプリ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(180deg, #eef4ff, #ffffff);
    }

    h1 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 20px;
      color: #333;
    }

    .card {
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
      font-size: 14px;
      margin-top: 10px;
      display: block;
    }

    input[type="number"], select {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      background: #fff;
    }

    .btn-area {
      margin-top: 15px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      border-radius: 8px;
      border: none;
      color: #fff;
      cursor: pointer;
    }

    .btn-main { background: #0078d4; }
    .btn-add  { background: #28a745; }
    .btn-reset{ background: #d9534f; }

    .result-box {
      background: #f7faff;
      padding: 12px;
      border-radius: 10px;
      border-left: 4px solid #0078d4;
      font-size: 14px;
      line-height: 1.6;
    }

    .total-box {
      background: #f9fff7;
      padding: 12px;
      border-radius: 10px;
      border-left: 4px solid #28a745;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<h1>ハイボール濃度計算アプリ</h1>

<div class="card">
  <label>コップの容量（ml）</label>
  <input type="number" id="glassVolume" placeholder="例：500">

  <label>希望アルコール度数（％）</label>
  <input type="number" id="targetPercent" placeholder="例：9">

  <label>原液の度数（％）</label>
  <input type="number" id="basePercent" placeholder="例：40">

  <label>氷の量</label>
  <select id="iceRatio">
    <option value="0">氷なし</option>
    <option value="0.3">少なめ（グラスの約3割）</option>
    <option value="0.5" selected>普通（グラスの約5割）</option>
    <option value="0.6">一杯（グラスの約6割）</option>
  </select>

  <div class="btn-area">
    <button class="btn-main" onclick="calcOnce()">計算</button>
    <button class="btn-add" onclick="addToTotal()">累計に追加</button>
    <button class="btn-reset" onclick="resetTotal()">リセット</button>
  </div>
</div>

<div class="card">
  <strong>◆今回の結果</strong>
  <div id="currentResult" class="result-box">まだ計算していません。</div>
</div>

<div class="card">
  <strong>◆累計</strong>
  <div id="totalResult" class="total-box">累計純アルコール量：0 g<br>累計単位数：0 単位</div>
</div>

<script>
  let totalPure = 0;

  function getInputs() {
    const g = parseFloat(document.getElementById('glassVolume').value);
    const t = parseFloat(document.getElementById('targetPercent').value);
    const b = parseFloat(document.getElementById('basePercent').value);
    const ice = parseFloat(document.getElementById('iceRatio').value);

    if (!g || g <= 0) return alert("コップ容量を入力してください。"), null;
    if (!t || t <= 0) return alert("希望度数を入力してください。"), null;
    if (!b || b <= 0) return alert("原液度数を入力してください。"), null;
    if (t > 100 || b > 100) return alert("度数は100％以下で入力してください。"), null;
    if (t > b) return alert("希望度数が原液度数を超えています。割って作る場合、希望度数は原液度数以下にしてください。"), null;

    return { g, t, b, ice };
  }

  function inputKey(g, t, b, ice) {
    return g + "," + t + "," + b + "," + ice;
  }

  function calcOnce() {
    const v = getInputs();
    if (!v) return;

    const liquidVolume = v.g * (1 - v.ice);
    const baseVolume = v.t * liquidVolume / v.b;
    const mixerVolume = liquidVolume - baseVolume;
    const pure = baseVolume * (v.b / 100) * 0.8;
    const unit = pure / 20;

    const box = document.getElementById("currentResult");
    box.innerHTML =
      `・コップ容量：${v.g} ml（氷 約${Math.round(v.ice * 100)}％）<br>
       ・液体の合計：約 ${liquidVolume.toFixed(1)} ml<br>
       ・希望度数：${v.t} %<br>
       ・原液度数：${v.b} %<br><br>
       ⇒ 必要な原液量：約 ${baseVolume.toFixed(1)} ml<br>
       ⇒ 割り材の量：約 ${mixerVolume.toFixed(1)} ml<br>
       ⇒ 純アルコール量：約 ${pure.toFixed(1)} g<br>
       ⇒ 単位数（20g）：約 ${unit.toFixed(2)} 単位<br>
       <span style="font-size:12px;color:#666;">※氷が溶けると少しずつ薄まります。純アルコール量は変わりません。</span>`;

    box.dataset.pure = pure;
    box.dataset.key = inputKey(v.g, v.t, v.b, v.ice);
  }

  function addToTotal() {
    const box = document.getElementById("currentResult");
    const pure = parseFloat(box.dataset.pure);
    if (!pure) return alert("まず計算してください。");

    const g = parseFloat(document.getElementById('glassVolume').value);
    const t = parseFloat(document.getElementById('targetPercent').value);
    const b = parseFloat(document.getElementById('basePercent').value);
    const ice = parseFloat(document.getElementById('iceRatio').value);
    if (box.dataset.key !== inputKey(g, t, b, ice)) {
      return alert("入力が計算時から変わっています。もう一度「計算」を押してください。");
    }

    totalPure += pure;
    updateTotal();
  }

  function resetTotal() {
    if (!confirm("累計をリセットしますか？")) return;
    totalPure = 0;
    const box = document.getElementById("currentResult");
    box.innerHTML = "まだ計算していません。";
    delete box.dataset.pure;
    delete box.dataset.key;
    updateTotal();
  }

  function updateTotal() {
    const unit = totalPure / 20;
    document.getElementById("totalResult").innerHTML =
      `累計純アルコール量：${totalPure.toFixed(1)} g<br>
       累計単位数：${unit.toFixed(2)} 単位`;
  }
</script>

</body>
</html>
